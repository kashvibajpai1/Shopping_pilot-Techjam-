<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shopping Copilot</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">🛍️ Shopping Copilot</div>
    <div class="turn-tracker">
      <span id="turn-label">Turn 0 / 10</span>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
  </header>

  <div class="layout">
    <aside class="profile-panel" id="profile-panel">
      <h2>Shopper profile</h2>
      <label>Purchase frequency
        <input id="p-frequency" type="text" value="3-4 prior purchases" />
      </label>
      <label>Rating style
        <input id="p-rating-style" type="text" value="usually positive" />
      </label>
      <label>Average prior rating
        <input id="p-avg-rating" type="number" step="0.1" min="1" max="5" value="4.5" />
      </label>
      <label>Preference tags (comma-separated)
        <input id="p-tags" type="text" placeholder="e.g. minimalist, outdoorsy" />
      </label>
      <label>Summary
        <textarea id="p-summary" rows="3" placeholder="Optional shopper summary"></textarea>
      </label>
      <button id="start-btn">Start new session</button>
    </aside>

    <main class="chat-panel">
      <div id="transcript" class="transcript"></div>

      <div id="complete-banner" class="complete-banner hidden">
        Session complete — 10/10 turns used.
      </div>

      <form id="composer" class="composer">
        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="send-btn" type="submit">Send</button>
      </form>
    </main>
  </div>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
